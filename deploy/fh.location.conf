# nginx snippet: https://ekat.ca/fh/ — DSHC Field Forms.
# Installed to /etc/nginx/snippets/fh.location.conf; ekat.conf's HTTPS server block has
#   include snippets/fh.location.conf;
# Static app from /var/www/fh/public, API proxied to fh-api.service on 127.0.0.1:3300.
# CSP comes from $csp_fh in ekat.conf's $ekat_csp map (inline styles + data:/blob: images
# for PDF generation). No add_header here: it would drop the server-level security headers.

location = /fh {
    return 301 https://$host/fh/;
}

# Sign-in, rate limited (zone defined in ekat.conf)
location = /fh/api/login {
    limit_req zone=ekat_login burst=6 nodelay;
    proxy_pass         http://127.0.0.1:3300/api/login;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ^~ /fh/api/ {
    proxy_pass         http://127.0.0.1:3300/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 40m;            # records carry photos and signatures
    proxy_read_timeout   60s;
}

# alias maps /fh/foo -> /var/www/fh/public/foo, so .git, server/ and deploy/ are never reachable.
location ^~ /fh/ {
    alias /var/www/fh/public/;
    index index.html;
    try_files $uri $uri/ =404;
}
