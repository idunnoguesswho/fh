name: Deploy

# https://ekat.ca/fh/: SSH into the VPS, where the deploy key is pinned server-side to
# `sudo -n /usr/local/sbin/fh-deploy` (deploy/fh-deploy.sh). That resets /var/www/fh to
# origin/main and restarts fh-api.service if server/ changed. The script below is ignored
# by the forced command and only documents what happens.
# Needs repo secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PORT.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: sudo -n /usr/local/sbin/fh-deploy
